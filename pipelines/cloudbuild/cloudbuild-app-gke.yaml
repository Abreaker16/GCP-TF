# ---------------------------------------------------------------------------
# Cloud Build pipeline: build, scan, push, and deploy to GKE
# ---------------------------------------------------------------------------
steps:
  - id: "build"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ENV}-${_APP_NAME}/app:${SHORT_SHA}"
      - "."

  - id: "scan"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        gcloud artifacts docker images scan \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ENV}-${_APP_NAME}/app:${SHORT_SHA} \
          --format="value(response.scan)" || echo "Vulnerability scan completed; review results in Artifact Analysis"

  - id: "push"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ENV}-${_APP_NAME}/app:${SHORT_SHA}"

  - id: "get-credentials"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "container"
      - "clusters"
      - "get-credentials"
      - "${_ENV}-${_APP_NAME}-gke"
      - "--region"
      - "${_REGION}"

  - id: "deploy"
    name: "gcr.io/cloud-builders/kubectl"
    entrypoint: "sh"
    args:
      - "-c"
      - |
        kubectl set image deployment/${_APP_NAME} \
          ${_APP_NAME}=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ENV}-${_APP_NAME}/app:${SHORT_SHA} \
          -n ${_K8S_NAMESPACE} --record
        kubectl rollout status deployment/${_APP_NAME} -n ${_K8S_NAMESPACE} --timeout=300s
    env:
      - "CLOUDSDK_COMPUTE_REGION=${_REGION}"
      - "CLOUDSDK_CONTAINER_CLUSTER=${_ENV}-${_APP_NAME}-gke"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ENV}-${_APP_NAME}/app:${SHORT_SHA}"

substitutions:
  _ENV: "dev"
  _REGION: "us-central1"
  _APP_NAME: "myapp"
  _K8S_NAMESPACE: "default"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
